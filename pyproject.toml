[project]
name = "proofops-workspace"
version = "0.0.0"
description = "ESG ProofOps workspace root"
requires-python = ">=3.12"
dependencies = [
  "proofops",
  "proofops-api",
  "proofops-worker",
  "proofops-agent",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=9.1.1,<10",
  "ruff>=0.8,<0.9",
  "mypy>=1.10,<2",
  "jsonschema>=4.18,<5",
  "pyyaml>=6.0,<7",
  "pip-audit==2.10.1",
  "h2==4.4.1",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.workspace]
members = ["packages/proofops", "apps/api", "apps/worker", "apps/agent"]

[tool.uv.sources]
proofops = { workspace = true }
proofops-api = { workspace = true }
proofops-worker = { workspace = true }
proofops-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "legacy_pin: explicitly pinned historical or experimental policy reproduction",
  "slow: measured expensive cold integration, external-process, or replay workload",
]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Archived readers and receipt wrappers are byte-hashed into persisted policies.
# Style-only rewrites would invalidate existing evidence; lint logic still applies.
[tool.ruff.lint.per-file-ignores]
"packages/proofops/adapters/local/_frozen_verifiers/native_paragraph_glyph_v2_cpu_swift/native_glyph_geometry.py" = ["I001"]
"packages/proofops/adapters/local/_frozen_verifiers/native_paragraph_glyph_v2_cpu_swift/source_verification.py" = ["I001"]

[tool.ruff.format]
exclude = [
  "packages/proofops/adapters/local/_frozen_verifiers/**",
  "packages/proofops/adapters/local/_frozen_upstage_ocr_profile_v21_20261015.py",
  "packages/proofops/adapters/local/upstage_ocr_profile_d2_v21.py",
  "packages/proofops/adapters/local/claim_span_bullet_alignment.py",
  "packages/proofops/adapters/local/claim_span_render_resolution.py",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["packages/proofops", "apps/api/src", "apps/worker/src", "apps/agent/src"]

# These archived readers dynamically compose _wrapper.Reader. Their bytes are
# pinned in persisted source policies; editing them would break historical replay.
# Suppress only that name-resolution code in these two modules, retaining all
# other checks and normal name-defined checks for newer readers (including v10).
# CI file targets use these names under explicit_package_bases and mypy_path.
[[tool.mypy.overrides]]
module = [
  "adapters.local.upstage_ocr_profile_v7",
  "adapters.local.upstage_ocr_profile_v8",
    # HX4 also uses an instance-private, byte-pinned Reader class at runtime.
    "adapters.local.upstage_ocr_profile_v16",
    "adapters.local.upstage_ocr_profile_v17",
]
disable_error_code = ["name-defined"]

# HX3 privately executes the byte-pinned v15 module before subclassing Reader.
# Mypy cannot resolve that runtime-created base; retain all other type checks.
[[tool.mypy.overrides]]
module = ["adapters.local.upstage_ocr_profile_v16", "adapters.local.upstage_ocr_profile_hx4_v16", "adapters.local.upstage_ocr_profile_v18"]
disable_error_code = ["name-defined"]

# D2's byte-pinned modules subclass Reader returned by private execution. Mypy
# cannot type that runtime base; retain every other diagnostic in these modules.
[[tool.mypy.overrides]]
module = [
  "adapters.local.upstage_ocr_profile_d2_v21",
  "adapters.local._frozen_upstage_ocr_profile_v21_20261015",
]
disable_error_code = ["valid-type", "misc"]
