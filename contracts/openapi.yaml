          title: Run Id
      - name: claim_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Claim Id
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[a-f0-9]{64}"$
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationAccepted'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden or CSRF failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or tenant mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict / gate blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: Stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Schema or domain validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate/budget limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-minimum-role: reviewer
      x-idempotency-required: true
      x-rate-limit: 10/min/user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                track:
                  enum:
                  - goal
                  - performance
                  - management
                  title: Track
                  type: string
                safe_harbor_category:
                  anyOf:
                  - enum:
                    - forward_looking
                    - emissions_estimate
                    - third_party_information
                    type: string
                  - type: 'null'
                  title: Safe Harbor Category
                dimensions:
                  additionalProperties:
                    anyOf:
                    - additionalProperties: false
                      properties:
                        source_index:
                          minimum: 0
                          title: Source Index
                          type: integer
                        quote:
                          minLength: 1
                          title: Quote
                          type: string
                        start:
                          anyOf:
                          - minimum: 0
                            type: integer
                          - type: 'null'
                          title: Start
                        end:
                          anyOf:
                          - minimum: 1
                            type: integer
                          - type: 'null'
                          title: End
                      required:
                      - source_index
                      - quote
                      title: ClassificationSpan
                      type: object
                    - type: 'null'
                  propertyNames:
                    enum:
                    - entity
                    - metric
                    - reporting_period
                    - facility
                    - scope
                    - product
                    - material
                    - boundary
                  title: Dimensions
                  type: object
                reason:
                  maxLength: 1000
                  minLength: 5
                  title: Reason
                  type: string
              required:
              - track
              - safe_harbor_category
              - dimensions
              - reason
              title: ClassificationRequest
              type: object
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-proofops_session
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              format: uuid
            retryable: &id003
              type: boolean
            details:
              type: object
              additionalProperties: false
              properties:
                field:
                  type: string
                reason:
                  type: string
                current_revision:
                  type: integer
                  minimum: 1
                retry_after_seconds:
                  type: integer
                  minimum: 0
          required:
          - code
          - message
          - request_id
          - retryable
      required:
      - error
    Session:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
        tenant_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        role:
          anyOf:
          - type: string
            enum:
            - viewer
            - editor
            - reviewer
            - admin
          - type: 'null'
        csrf_token:
          type: string
        expires_at: &id001
          type: string
          format: date-time
      required:
      - user_id
      - tenant_id
      - role
      - csrf_token
      - expires_at
    TenantSelect:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          type: string
          format: uuid
      required:
      - tenant_id
    DocumentCreate:
      type: object
      additionalProperties: false
      properties:
        company_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        document_type:
          type: string
          enum:
          - sustainability_report
          - annual_report_section
      required:
      - company_id
      - title
      - document_type
    Document:
      type: object
      additionalProperties: false
      properties:
        document_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        title:
          type: string
        document_type:
          type: string
          enum:
          - sustainability_report
          - annual_report_section
        latest_version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        revision:
          type: integer
          minimum: 1
        created_at: *id001
      required:
      - document_id
      - company_id
      - title
      - document_type
      - revision
      - created_at
    VersionCreate:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 200
        size_bytes:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256: &id002
          type: string
          pattern: ^[0-9a-f]{64}$
        report_year:
          type: integer
          minimum: 1900
          maximum: 2200
        industry_system:
          type: string
          enum:
          - gics
          - sasb
          - custom
          - unknown
        industry_code:
          anyOf:
          - type: string
          - type: 'null'
        consolidation_scope:
          anyOf:
          - type: string
          - type: 'null'
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        rights_profile_id:
          type: string
          format: uuid
      required:
      - filename
      - size_bytes
      - sha256
      - report_year
      - industry_system
      - period_start
      - period_end
      - rights_profile_id
    UploadTicket:
      type: object
      additionalProperties: false
      properties:
        upload_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        post_url:
          type: string
        post_fields:
          type: object
          additionalProperties:
            type: string
        expires_at: *id001
      required:
      - upload_id
      - document_id
      - post_url
      - post_fields
      - expires_at
    UploadComplete:
      type: object
      additionalProperties: false
      properties:
        sha256: *id002
        size_bytes:
          type: integer
          minimum: 1
          maximum: 104857600
      required:
      - sha256
      - size_bytes
    JobAccepted:
      type: object
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
        resource_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - ready
        status_url:
          type: string
      required:
      - job_id
      - resource_id
      - status
      - status_url
    DocumentVersion:
      type: object
      additionalProperties: false
      properties:
        version_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        sha256: *id002
        report_year:
          type: integer
          minimum: 1900
        page_count:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - validating
          - ready
          - rejected
        created_at: *id001
      required:
      - version_id
      - document_id
      - sha256
      - report_year
      - status
      - created_at
    RunCreate:
      type: object
      additionalProperties: false
      properties:
        document_version_id:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - disclosure
          - advertising
        scope:
          type: string
          enum:
          - full
          - declared_subset
        selected_pages:
          type: array
          items:
            type: integer
            minimum: 1
        rule_pack_id:
          type: string
          format: uuid
        consent_profile_id:
          type: string
          format: uuid
        runtime_binding_id:
          type: string
          format: uuid
      required:
      - document_version_id
      - mode
      - scope
      - rule_pack_id
      - consent_profile_id
      - runtime_binding_id
      allOf:
      - if:
          properties:
            scope:
              const: full
        then:
          not:
            required:
            - selected_pages
        else:
          required:
          - selected_pages
          properties:
            selected_pages:
              minItems: 1
              uniqueItems: true
    Coverage:
      type: object
      additionalProperties: false
      properties:
        pages_total:
          type: integer
          minimum: 0
        pages_processed:
          type: integer
          minimum: 0
        pages_unreadable:
          type: integer
          minimum: 0
        pages_unprocessed:
          type: integer
          minimum: 0
        chunks_discovered:
          type: integer
          minimum: 0
        chunks_processed:
          type: integer
          minimum: 0
        claims_discovered:
          type: integer
          minimum: 0
        claims_decided:
          type: integer
          minimum: 0
        claims_needs_review:
          type: integer
          minimum: 0
        full_scope: *id003
        complete: *id003
      required:
      - pages_total
      - pages_processed
      - pages_unreadable
      - pages_unprocessed
      - chunks_discovered
      - chunks_processed
      - claims_discovered
      - claims_decided
      - claims_needs_review
      - full_scope
      - complete
    Run:
      type: object
      additionalProperties: false
      properties:
        run_id:
          type: string
          format: uuid
        document_version_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - partial
          - completed
          - failed
          - cancelled
        current_stage:
          type: string
        revision:
          type: integer
          minimum: 1
        mutation_epoch:
          type: integer
          minimum: 0
        coverage:
          $ref: '#/components/schemas/Coverage'
        rule_pack_sha256: *id002
        created_at: *id001
      required:
      - run_id
      - document_version_id
      - status
      - revision
      - mutation_epoch
      - coverage
      - rule_pack_sha256
      - created_at
    ActionReason:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 1000
      required:
      - reason
    RescoreCreate:
      type: object
      additionalProperties: false
      properties:
        rule_pack_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 5
          maxLength: 1000
      required:
      - rule_pack_id
      - reason
    Bbox:
      type: array
      items:
        type: number
      minItems: 4
      maxItems: 4
      description: Canonical top-left display points, x0,y0,x1,y1; missing geometry is null, not zero.
    SourceRef:
      type: object
      additionalProperties: false
      properties:
        source_id:
          type: string
          format: uuid
        document_version_id:
          type: string
          format: uuid
        parse_manifest_id:
          type: string
          format: uuid
        page_num:
          type: integer
          minimum: 1
        printed_page_label:
          anyOf:
          - type: string
          - type: 'null'
        bbox:
          anyOf:
          - $ref: '#/components/schemas/Bbox'
          - type: 'null'
        raw_text_sha256: *id002
        quote:
          type: string
        char_start:
          type: integer
          minimum: 0
        char_end:
          type: integer
          minimum: 0
        location_quality:
          type: string
          enum:
          - located
          - unlocated
          - unreadable
        verification_state:
          type: string
          enum:
          - verified
          - candidate
          - rejected
      required:
      - source_id
      - document_version_id
      - parse_manifest_id
      - page_num
      - printed_page_label
      - bbox
      - raw_text_sha256
      - quote
      - char_start
      - char_end
      - location_quality
      - verification_state
    Element:
      type: object
      additionalProperties: false
      properties:
        element_id:
          type: string
        state:
          type: string
          enum:
          - present
          - absent
          - unknown
          - conflict
          - not_applicable
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
        normalized_value:
          anyOf:
          - type: string
          - type: 'null'
        credited_from:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        reason_code:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - element_id
      - state
      - evidence_refs
      - normalized_value
      - credited_from
      - reason_code
      allOf:
      - if:
          properties:
            state:
              const: present
        then:
          properties:
            evidence_refs:
              minItems: 1
    Decision:
      type: object
      additionalProperties: false
      properties:
        decision_revision:
          type: integer
          minimum: 1
        tag_revision:
          type: integer
          minimum: 1
        decision_status:
          type: string
          enum:
          - decided
          - blocked_evidence
          - blocked_rule_gap
          - not_applicable
          - not_run
        evidence_grade:
          anyOf:
          - type: string
            enum:
            - E0
            - E1
            - E2
            - E3
          - type: 'null'
        label:
          anyOf:
          - type: string
            enum:
            - SUBSTANTIATED
            - INCOMPLETE
            - UNSUBSTANTIATED
          - type: 'null'
        sublabel:
          anyOf:
          - type: string
            enum:
            - PERF
            - IMPL
          - type: 'null'
        review_status:
          type: string
          enum:
          - auto_confirmed
          - needs_review
          - human_confirmed
          - ai_delegated_confirmed
        missing_elements:
          type: array
          items:
            type: string
        rule_ids:
          type: array
          items:
            type: string
        rule_pack_sha256: *id002
        semantic_hash: *id002
        gap_ids:
          type: array
          items:
            type: string
        grade_range:
          description: Reachable ladder grades while ladder evidence is unresolved
            (engine v3+). Not a grade or label; null when decided or when a separate
            path/rule gap blocks. Absent on decisions stored before engine v3.
          anyOf:
          - type: object
            additionalProperties: false
            properties:
              floor:
                type: string
                enum:
                - E0
                - E1
                - E2
                - E3
              ceiling:
                type: string
                enum:
                - E0
                - E1
                - E2
                - E3
              open_elements:
                type: array
                items:
                  type: string
            required:
            - floor
            - ceiling
            - open_elements
          - type: 'null'
      required:
      - decision_revision
      - tag_revision
      - decision_status
      - evidence_grade
      - label
      - sublabel
      - review_status
      - missing_elements
      - rule_ids
      - rule_pack_sha256
      - semantic_hash
      - gap_ids
      allOf:
      - if:
          properties:
            decision_status:
              const: decided
        then:
          properties:
            grade_range:
              type: 'null'
      - if:
          properties:
            decision_status:
              const: decided
        then:
          properties:
            evidence_grade:
              type: string
              enum:
              - E0
              - E1
              - E2
              - E3
            label:
              type: string
              enum:
              - SUBSTANTIATED
              - INCOMPLETE
              - UNSUBSTANTIATED
        else:
          properties:
            evidence_grade:
              type: 'null'
            label:
              type: 'null'
            sublabel:
              type: 'null'
      - if:
          properties:
            evidence_grade:
              const: E0
        then:
          properties:
            label:
              const: UNSUBSTANTIATED
      - if:
          properties:
            evidence_grade:
              const: E1
        then:
          properties:
            label:
              const: INCOMPLETE
      - if:
          properties:
            evidence_grade:
              const: E2
        then:
          properties:
            label:
              const: INCOMPLETE
      - if:
          properties:
            evidence_grade:
              const: E3
        then:
          properties:
            label:
              const: SUBSTANTIATED
    ClaimSummary:
      type: object
      additionalProperties: false
      properties:
        claim_id:
          type: string
          format: uuid
        page_num:
          type: integer
          minimum: 1
        quote:
          type: string
        track:
          anyOf:
          - type: string
            enum:
            - goal
            - performance
            - management
          - type: 'null'
        topic_ids:
          type: array
          items:
            type: string
        decision:
          anyOf:
          - $ref: '#/components/schemas/Decision'
          - type: 'null'
        revision:
          type: integer
          minimum: 1
      required:
      - claim_id
      - page_num
      - quote
      - track
      - topic_ids
      - decision
      - revision
    AssuranceMatch:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - covered
          - not_covered
          - undetermined
        level:
          anyOf:
          - type: string
            enum:
            - limited
            - reasonable
            - none
          - type: 'null'
        provider:
          anyOf:
          - type: string
          - type: 'null'
        statement_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        metric_match:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
        period_match:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
        boundary_match:
          type: string
          enum:
          - 'yes'
          - 'no'
          - unknown
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
      required:
      - status
      - level
      - provider
      - statement_id
      - metric_match
      - period_match
      - boundary_match
      - evidence_refs
    ReviewedContext:
      additionalProperties: false
      properties:
        origin:
          const: ai_delegated
          title: Origin
          type: string
        dimensions:
          $ref: '#/components/schemas/ReviewedDimensions'
        numeric_check:
          $ref: '#/components/schemas/NumericContextCheck'
      required:
      - origin
      - dimensions
      - numeric_check
      title: ReviewedContext
      type: object
    ReviewedDimensions:
      additionalProperties: false
      properties:
        facility:
          $ref: '#/components/schemas/SourceRef'
        reporting_period:
          $ref: '#/components/schemas/SourceRef'
        metric:
          $ref: '#/components/schemas/SourceRef'
        value:
          $ref: '#/components/schemas/SourceRef'
        unit:
          $ref: '#/components/schemas/SourceRef'
      required:
      - facility
      - reporting_period
      - metric
      - value
      - unit
      title: ReviewedDimensions
      type: object
    NumericContextCheck:
      additionalProperties: false
      properties:
        status:
          const: needs_review
          title: Status
          type: string
        reason:
          const: no_comparable_table_observation
          title: Reason
          type: string
        considered:
          items:
            $ref: '#/components/schemas/NumericCandidateReview'
          title: Considered
          type: array
      required:
      - status
      - reason
      - considered
      title: NumericContextCheck
      type: object
    NumericCandidateReview:
      additionalProperties: false
      properties:
        source_ref:
          $ref: '#/components/schemas/SourceRef'
        status:
          enum:
          - claim_source
          - outside_reviewed_section
          - unresolved
          title: Status
          type: string
      required:
      - source_ref
      - status
      title: NumericCandidateReview
      type: object
    SubmittedReview:
      additionalProperties: false
      properties:
        schema_version:
          const: 1
          title: Schema Version
          type: integer
        status:
          const: reference_only
          title: Status
          type: string
        origin:
          enum:
          - data_manager_submission
          - ai_corrected_submission
          title: Origin
          type: string
        tenant_id:
          format: uuid
          title: Tenant Id
          type: string
        run_id:
          format: uuid
          title: Run Id
          type: string
        document_version_id:
          format: uuid
          title: Document Version Id
          type: string
        claim_id:
          format: uuid
          title: Claim Id
          type: string
        external_claim_id:
          title: External Claim Id
          type: string
        reference_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Reference Sha256
          type: string
        source_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Source Sha256
          type: string
        run_input_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Run Input Sha256
          type: string
        claim_snapshot_sha256:
          pattern: ^[0-9a-f]{64}$
          title: Claim Snapshot Sha256
          type: string
        claim_source_quality:
          title: Claim Source Quality
          type: string
        files_sha256:
          additionalProperties:
            pattern: ^[0-9a-f]{64}$
            type: string
          title: Files Sha256
          type: object
        tables:
          additionalProperties:
            items:
              additionalProperties:
                type: string
              type: object
            type: array
          propertyNames:
            enum:
            - claims
            - elements
            - numeric
            - assurance
          title: Tables
          type: object
      required:
      - schema_version
      - status
      - origin
      - tenant_id
      - run_id
      - document_version_id
      - claim_id
      - external_claim_id
      - reference_sha256
      - source_sha256
      - run_input_sha256
      - claim_snapshot_sha256
      - claim_source_quality
      - files_sha256
      - tables
      title: SubmittedReview
      type: object
    ClaimDetail:
      type: object
      additionalProperties: false
      properties:
        submitted_reviews:
          type: array
          items:
            $ref: '#/components/schemas/SubmittedReview'
        reviewed_context:
          anyOf:
          - $ref: '#/components/schemas/ReviewedContext'
          - type: 'null'
        claim:
          $ref: '#/components/schemas/ClaimSummary'
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        assurance:
          $ref: '#/components/schemas/AssuranceMatch'
        replicate_request_ids:
          type: array
          items:
            type: string
        packet_sha256: *id002
        suggestion:
          anyOf:
          - type: string
          - type: 'null'
