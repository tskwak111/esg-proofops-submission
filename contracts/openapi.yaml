  /v1/reviews/{review_id}/re-review:
    post:
      operationId: review_re_review
      summary: review_re_review
      description: >-
        Explicit re-review of an already-resolved review. Additive to
        review_resolve with identical guards (reviewer role, session cookie,
        CSRF, strict If-Match on the current review revision, Idempotency-Key).
        Targets the current tag head and appends the next immutable
        tag/decision/review revisions; prior revisions and exports are never
        mutated. Provenance stays human on this HTTP route. Returns 412
        STALE_REVIEW_REVISION when the review is still open (use review_resolve)
        or when the supplied base tag revision is not the current head.
      x-minimum-role: reviewer
      x-rate-limit: 10/min/user
      x-idempotency-required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Success
