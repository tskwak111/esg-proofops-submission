[project]
name = "proofops-api"
version = "0.0.0"
description = "ESG ProofOps FastAPI service (TASK-000 baseline)"
requires-python = ">=3.12"
dependencies = [
  "proofops[auth,verification,parsing]",
  "fastapi==0.141.1",
  "pydantic>=2.0,<3",
  "uvicorn>=0.30,<0.35",
  "python-multipart==0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofops_api"]

[tool.uv.sources]
proofops = { workspace = true }
