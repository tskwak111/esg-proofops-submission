[project]
name = "proofops-worker"
version = "0.0.0"
description = "ESG ProofOps worker service (TASK-000 baseline)"
requires-python = ">=3.12"
dependencies = [
  "proofops[parsing]",
  "proofops-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofops_worker"]

[tool.uv.sources]
proofops = { workspace = true }
proofops-agent = { workspace = true }
